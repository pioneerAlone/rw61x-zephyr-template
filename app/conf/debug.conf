# debug.conf — Debug Kconfig Fragment
#
# Enables verbose logging for development and troubleshooting.
# Usage: west build -b frdm_rw612 app/ -- -DEXTRA_CONF_FILE=conf/debug.conf
#
# This fragment is composable with other fragments:
# west build -b frdm_rw612 app/ -- -DEXTRA_CONF_FILE="conf/debug.conf;conf/wifi.conf"

# Set log level to DEBUG (4)
CONFIG_LOG_DEFAULT_LEVEL=4

# Enable additional debug features
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
