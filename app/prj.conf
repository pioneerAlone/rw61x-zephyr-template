# prj.conf — Base Kconfig for RW61x Zephyr Template
#
# This file contains the minimal configuration required for:
# - UART console output
# - Logging subsystem at INFO level
# - UART backend for logs
#
# To add debug logging, use: west build -b frdm_rw612 app/ -- -DEXTRA_CONF_FILE=conf/debug.conf
# To add WiFi support, use: west build -b frdm_rw612 app/ -- -DEXTRA_CONF_FILE=conf/wifi.conf
# To combine multiple fragments: -DEXTRA_CONF_FILE="conf/debug.conf;conf/wifi.conf"

# Console configuration
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Logging subsystem
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
